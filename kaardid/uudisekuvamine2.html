<!DOCTYPE html>
<html>
  <head>
    <title>Teated</title>

    <style>
      #s2 {
        border: 2px solid darkseagreen;
      }
    </style>

    <script>
      function loe(){
        fetch("https://script.google.com/macros/s/AKfycbxvWEadqqmQwN7yFLU0TRJJdHwRJuljpc3Hw7sFv8CKcoYm8Mu-kMF71EvVDnIjHyR2/exec")
          .then(d => d.json())
          .then(kuva);
      }

      function kuva(tekst){
        console.log(tekst);
        v1.innerText = tekst;
        p1.innerText = tekst[0];
        s1.innerText = tekst[1];
        s2.innerText = tekst[2];
      }
    </script>
  </head>

  <body onload="loe(); setInterval('loe()', 10000)">
    Teade: <span id="v1">teate koht</span>

    <input type="button" value="Kuva teade" onclick="loe()"/>

    <h1 id="p1">Pealkirja koht</h1>

    <div id="s1">sisu koht</div>

    <div id="s2">teine lause</div>
  </body>
</html>
